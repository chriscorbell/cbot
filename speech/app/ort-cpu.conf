# onnxruntime session settings for every sherpa-onnx model (asr.py passes this file as the provider
# config). Measured on the 4-CPU cap in speech/bench/README.md.
#
# Idle worker threads sleep instead of spinning. The encoder, decoder and joiner sessions each have
# a thread pool; spinning pools burn the container's CPU quota and the kernel throttles it. A 5 s
# clip took about 1.4 s with spinning and 0.2 s without.
SessionConfig.session.intra_op.allow_spinning=0
SessionConfig.session.inter_op.allow_spinning=0
# No memory arena. The arena keeps the peak of every clip length it has seen: one 100 s clip grew the
# process by 1.9 GB for good. Without it memory stays flat, for about 5% more time on short clips.
EnableCpuMemArena=0
