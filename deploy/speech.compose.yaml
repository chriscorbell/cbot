# The speech service on Dispatch's production host (scripts/release.sh runs it). Its network is internal,
# so it has no route out; the host reaches it at a fixed address, set in deploy/speech.env, which
# release.sh passes to compose with --env-file and deploy/dispatch.service passes to the server.
name: dispatch-speech
services:
  speech:
    image: ${SPEECH_IMAGE:?set SPEECH_IMAGE}
    environment:
      SPEECH_THREADS: 4
    cpus: 4
    init: true
    restart: unless-stopped
    networks:
      speech:
        ipv4_address: ${SPEECH_IP:?set SPEECH_IP (deploy/speech.env)}
networks:
  speech:
    internal: true
    ipam:
      config:
        - subnet: ${SPEECH_SUBNET:?set SPEECH_SUBNET (deploy/speech.env)}
