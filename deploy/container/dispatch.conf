# The dev container's changes to dispatch.service (Dockerfile): the server runs from the image's /app,
# what a release unpacks to (scripts/build-release.sh), with the Node it brings; listens on every
# address in the container so compose can publish its port; keeps its data in the /data volume; and
# reads the environment compose gives the container, which the entrypoint
# (deploy/container/entrypoint.sh) writes to /etc/dispatch/env.
[Service]
WorkingDirectory=/app
Environment=HOST=0.0.0.0 DATA_DIR=/data
EnvironmentFile=
EnvironmentFile=/etc/dispatch/env
ExecStart=
ExecStart=/app/node/bin/node server/dist/index.js
