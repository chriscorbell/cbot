# Weekly dependency updates, one pull request per ecosystem, each gated by the check workflow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /speech
    schedule: { interval: weekly }
    groups:
      pip: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/, /speech]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
