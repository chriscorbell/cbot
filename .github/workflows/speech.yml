# The speech image, built only when speech/ changes: it compiles sherpa-onnx and downloads the models,
# each checked against models.json. Nothing is pushed.
name: speech

on:
  pull_request:
    paths: [speech/**, .github/workflows/speech.yml]
  push:
    branches: [main]
    paths: [speech/**, .github/workflows/speech.yml]

permissions:
  contents: read

concurrency:
  group: speech-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speech:
    runs-on: ubuntu-24.04
    # Compiling sherpa-onnx with nothing cached takes more than an hour on a hosted runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: speech
          push: false
          cache-from: type=gha,scope=speech
          # Only main writes the cache. GitHub keeps 10 GB a repository and a pull request's copy is
          # no use to anything else, so writing one from each pull request pushed main's out.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=speech,mode=max' || '' }}
