# The app image, built only when what goes into it changes. It runs provision.sh, the same script
# that sets up a real machine, so this is also the check that provisioning still works. Nothing is pushed.
name: app-image

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, deploy/**, scripts/provision.sh, scripts/install-units.sh, scripts/build-release.sh, scripts/node.sha256, .node-version, package-lock.json, .github/workflows/app-image.yml]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, deploy/**, scripts/provision.sh, scripts/install-units.sh, scripts/build-release.sh, scripts/node.sha256, .node-version, package-lock.json, .github/workflows/app-image.yml]

permissions:
  contents: read

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
